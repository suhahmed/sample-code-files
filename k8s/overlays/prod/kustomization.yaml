apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flask-demo-prod
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
patches:
  - target: { kind: Deployment, name: flask-gitops-demo }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: ConfigMap, name: flask-gitops-demo }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod
# The CI pipeline updates newTag (dev automatically; prod via promotion PR).
images:
  - name: flask-gitops-demo
    newName: ghcr.io/OWNER/flask-gitops-demo
    newTag: latest
