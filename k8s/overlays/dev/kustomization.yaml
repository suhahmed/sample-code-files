apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flask-demo-dev
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
patches:
  - target: { kind: Deployment, name: sample-code-files }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ConfigMap, name: sample-code-files }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
# The CI pipeline updates newTag (dev automatically; prod via promotion PR).
images:
  - name: sample-code-files
    newName: ghcr.io/suhahmed/sample-code-files
    newTag: latest
