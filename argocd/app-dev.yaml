# Dev: fully automated - every merge to main is deployed within ~3 min (or instantly via webhook).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-demo-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flask-demo
  source:
    repoURL: https://github.com/OWNER/flask-gitops-demo.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: flask-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
