# App-of-apps: apply this once (kubectl apply -n argocd -f argocd/root-app.yaml)
# and ArgoCD manages the project + both environment Applications from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-demo-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/flask-gitops-demo.git
    targetRevision: main
    path: argocd
    directory:
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
