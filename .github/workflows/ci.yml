name: CI/CD (DevSecOps)

on:
  pull_request:
    branches: [main]
    paths-ignore: ["k8s/overlays/**", "argocd/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["k8s/overlays/**", "argocd/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sample-code-files
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- 1. Build & test
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + style)
        run: ruff check . && ruff format --check .
      - name: Pytest with coverage gate (>=80%)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.xml }

  # ---------------------------------------------------------------- 2. Security scans (shift-left)
  sast-sca:
    name: SAST, SCA & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # full history for secret scanning
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install bandit==1.8.6 pip-audit==2.9.0
      - name: SAST - Bandit
        run: bandit -r app -ll
      - name: SCA - pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt --strict
      - name: Secrets - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # required for org-owned repos

  iac-scan:
    name: Dockerfile & K8s manifest checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Hadolint (Dockerfile best practices)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Render overlays & validate schemas (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          for env in dev prod; do
            kubectl kustomize k8s/overlays/$env > rendered-$env.yaml
            ./kubeconform -strict -summary rendered-$env.yaml
          done
      - name: Trivy misconfiguration scan (Dockerfile + K8s)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------------- 3. Build, scan, sign, publish
  build-image:
    name: Build, scan & sign image
    needs: [test, sast-sca, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless cosign signing (OIDC)
      security-events: write # upload Trivy SARIF
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - name: Normalise image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3   # lets us build arm64 too (Apple Silicon / Graviton nodes)
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/app:scan
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (gate on HIGH/CRITICAL fixable CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/app:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy SARIF -> GitHub Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/app:scan
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'pull_request'
        with: { sarif_file: trivy.sarif }

      # ---- everything below runs only on main ----
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          provenance: mode=max   # SLSA build provenance attestation
          sbom: true
      - name: Generate SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign image & attach SBOM attestation (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"

  # ---------------------------------------------------------------- 4. GitOps: bump dev tag -> ArgoCD syncs
  deploy-dev:
    name: Update dev manifest (GitOps)
    if: github.event_name != 'pull_request'
    needs: build-image
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Normalise image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Set image tag in dev overlay
        working-directory: k8s/overlays/dev
        run: |
          kustomize edit set image \
            sample-code-files=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.tag }}
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy(dev): ${{ needs.build-image.outputs.tag }} [skip ci]"
          git push
